<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>It's 5 O'Clock Somewhere</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>It's 5 O'Clock Somewhere</h1>
            <p class="subtitle">Discover where people are starting their happy hour right now!</p>
        </header>
        
        <main>
            <div class="card">
                <div class="city-time">
                    <h2 id="cityName">Loading city...</h2>
                    <p id="localTime">Local time: --:--</p>
                    <p id="timeAgo">It's been 5pm for -- minutes</p>
                </div>
                
                <div class="country-info">
                    <h3 id="countryName">Country</h3>
                    <div id="countryFacts">
                        <p>Loading fun facts...</p>
                    </div>
                </div>
                
                <button id="refreshBtn">Find Another 5 O'Clock!</button>
            </div>
        </main>
        
        <footer>
            <p>&copy; 2025 It's 5 O'Clock Somewhere</p>
        </footer>
    </div>

    <script src="config.js"></script>
    <script src="main.js"></script>
</body>
</html>
